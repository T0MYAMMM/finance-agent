[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "0.2.0"
description = "Hermes finance assistant: doeedd client, CLI and receipt helpers"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Receipt uploads and the Sheets migration; the OAuth wrapper itself comes from Hermes's
# google-workspace skill.
drive = ["google-api-python-client>=2.100"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["doeedd_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The original Sheets scripts are kept unchanged until the cutover retires them.
extend-exclude = ["finance.py", "build_finance_system.py", "gws_auth.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
